name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building ThoughtHolder version: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        working-directory: ./thought_holder_flutter
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/thought_holder_release.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=thought_holder_release.jks
          EOF
          cp android/app/thought_holder_release.jks thought_holder_release.jks
          cp android/key.properties key.properties

      - name: Flutter Dependencies
        working-directory: ./thought_holder_flutter
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./thought_holder_flutter
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Copy & Name APK
        run: |
          mkdir -p artifacts
          cp thought_holder_flutter/build/app/outputs/flutter-apk/app-release.apk artifacts/thoughtholder-${{ env.VERSION }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: artifacts/thoughtholder-${{ env.VERSION }}.apk

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building ThoughtHolder version: $VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Flutter Dependencies
        working-directory: ./thought_holder_flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Application
        working-directory: ./thought_holder_flutter
        shell: pwsh
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        working-directory: ./thought_holder_flutter
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($cand in $candidates) {
              if (Test-Path $cand) { $iscc = $cand; break }
            }
          }
          if (-not $iscc) {
            throw "ISCC.exe not found on runner."
          }
          Write-Host "Using ISCC at $iscc"
          & $iscc "/DMyAppVersion=${{ env.VERSION }}" "windows\installer\thought_holder_setup.iss"

      - name: Prepare Windows Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "thought_holder_flutter\build\windows\installer\thoughtholder-setup-${{ env.VERSION }}.exe" -Destination "artifacts\"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: artifacts/thoughtholder-setup-${{ env.VERSION }}.exe

  create-release:
    name: Package Manifest & Publish Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Version & Build
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Extract build number from pubspec.yaml
          BUILD_NUM=$(grep -m 1 'version:' thought_holder_flutter/pubspec.yaml | awk -F'+' '{print $2}' | tr -d ' \r\n')
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM=1
          fi
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Organize Release Files & Compute Checksums
        run: |
          mkdir -p release_assets
          cp downloaded_artifacts/android-artifact/thoughtholder-${{ env.VERSION }}.apk release_assets/
          cp downloaded_artifacts/windows-artifact/thoughtholder-setup-${{ env.VERSION }}.exe release_assets/

          python3 tool/generate_version_json.py \
            --version "${{ env.VERSION }}" \
            --build "${{ env.BUILD_NUM }}" \
            --min-build 1 \
            --apk "release_assets/thoughtholder-${{ env.VERSION }}.apk" \
            --setup-exe "release_assets/thoughtholder-setup-${{ env.VERSION }}.exe" \
            --notes-file "RELEASE_NOTES.md" \
            --repo "${{ github.repository }}" \
            --output "release_assets/version.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Thoughtholder v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_assets/thoughtholder-${{ env.VERSION }}.apk
            release_assets/thoughtholder-setup-${{ env.VERSION }}.exe
            release_assets/version.json

